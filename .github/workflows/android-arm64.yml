name: Android arm64 APK

on:
  workflow_dispatch:
  push:
    branches: ['**']

concurrency:
  group: android-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-36"

      - name: Build APK
        working-directory: src/android
        run: ./gradlew assembleMainlineRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: eden-android-arm64
          path: src/android/app/build/outputs/apk/mainline/release/*.apk
